[project]
name = "satis-factory-maker"
version = "0.1.0"
description = "CLI that builds Satisfactory factory layers from a target item or available resources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer==0.27.2",
    "rich==15.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pyinstaller==6.10.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
